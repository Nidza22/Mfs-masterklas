<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1360" height="790" viewBox="0 0 1360 790" role="img" aria-label="Savijanje, primicanje i unutrašnja rotacija kuka">
<rect width="1360" height="790" fill="#F8F9FC"/><rect x="32" y="30" width="1296" height="730" rx="32" fill="white" stroke="#D6DEE7" stroke-width="3"/>

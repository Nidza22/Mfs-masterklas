<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840"><rect width="1600" height="840" fill="#F7F9FB"/><rect x="30" y="28" width="1540" height="781" rx="24" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="3"/><rect x="49" y="48" width="1502" height="126" rx="18" fill="#D4EBE6"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="79" y="93" font-size="28" fill="#34716F" font-weight="700">MFS MASTERKLAS · KUK · TEST 11</text><text x="79" y="146" font-size="39" fill="#173D43" font-weight="700">Aktivni test dubokih rotatora</text><text x="53" y="208" font-size="24" fill="#61747B">POLOŽAJ I POSTUPAK · 5 KORAKA</text><rect x="52" y="223" width="910" height="75" rx="14" fill="#E8F3F1"/><circle cx="95" cy="260" r="25" fill="#347776"/><text x="95" y="269" text-anchor="middle" fill="white" font-size="25" font-weight="700">1</text><text x="146" y="270" fill="#243840" font-size="26">Lezi na bok, u kontrolisanom položaju.</text><rect x="52" y="309" width="910" height="75" rx="14" fill="#EFF2FA"/><circle cx="95" cy="346" r="25" fill="#347776"/><text x="95" y="355" text-anchor="middle" fill="white" font-size="25" font-weight="700">2</text><text x="146" y="356" fill="#243840" font-size="26">Karlica ostaje stabilna.</text><rect x="52" y="395" width="910" height="75" rx="14" fill="#E8F3F1"/><circle cx="95" cy="432" r="25" fill="#347776"/><text x="95" y="441" text-anchor="middle" fill="white" font-size="25" font-weight="700">3</text><text x="146" y="442" fill="#243840" font-size="26">Odvodi i rotiraj butinu spolja.</text><rect x="52" y="481" width="910" height="75" rx="14" fill="#EFF2FA"/><circle cx="95" cy="518" r="25" fill="#347776"/><text x="95" y="527" text-anchor="middle" fill="white" font-size="25" font-weight="700">4</text><text x="146" y="528" fill="#243840" font-size="26">Ispitivač daje postepeni otpor.</text><rect x="52" y="567" width="910" height="75" rx="14" fill="#E8F3F1"/><circle cx="95" cy="604" r="25" fill="#347776"/><text x="95" y="613" text-anchor="middle" fill="white" font-size="25" font-weight="700">5</text><text x="146" y="614" fill="#243840" font-size="26">Beleži poznat dubok glutealni bol.</text><rect x="986" y="223" width="550" height="197" rx="17" fill="#F2ECF8"/><text x="1010" y="265" font-size="27" font-weight="700" fill="#715288">ŠTA MOŽE DA PODRŽI?</text><text x="1010" y="309" font-size="23" fill="#304451">Poznat zadnji bol pri doziranom</text><text x="1010" y="343" font-size="23" fill="#304451">otporu.</text><rect x="986" y="436" width="550" height="207" rx="17" fill="#F8ECEC"/><text x="1010" y="479" font-size="26" font-weight="700" fill="#A05966">ŠTA NE DOKAZUJE?</text><text x="1010" y="526" font-size="23" fill="#304451">Ne može izolovati piriformis kao</text><text x="1010" y="560" font-size="23" fill="#304451">jedini uzrok.</text><line x1="60" x2="1538" y1="690" y2="690" stroke="#C8D6DC" stroke-width="3"/><text x="70" y="735" font-size="24" font-weight="700" fill="#8B6570">EDUKATIVNA ŠEMA — nije fotografija položaja i nije dijagnostički dokaz</text><text x="70" y="772" font-size="23" fill="#62777F">Detaljne korake, bezbednost i izvore pročitaj u tekstualnoj kartici.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="760" viewBox="0 0 1260 760"><rect width="1260" height="760" fill="#F8F9FB"/><rect x="25" y="25" width="1210" height="710" rx="26" fill="white" stroke="#D4DAE3" stroke-width="3"/><rect x="40" y="40" width="1180" height="122" rx="18" fill="#CDE5E0"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="65" y="85" font-size="25" font-weight="700" fill="#387477">MFS MASTERKLAS · KUK · KARTICA 07</text><text x="65" y="135" font-size="32" font-weight="700" fill="#19464D">Savijanje kuka protiv otpora</text><text x="60" y="198" font-size="22" fill="#3A5862">Bol i kapacitet pregibača kuka u sedećem položaju</text><rect x="56" y="215" width="800" height="70" rx="12" fill="#E8F4F0"/><circle cx="91" cy="250" r="23" fill="#356F72"/><text x="91" y="259" font-size="23" text-anchor="middle" font-weight="700" fill="white">1</text><text x="131" y="260" font-size="25" fill="#253640">Sedi uspravno na ivici stola.</text>
<rect x="56" y="297" width="800" height="70" rx="12" fill="#F4F0F9"/><circle cx="91" cy="332" r="23" fill="#356F72"/><text x="91" y="341" font-size="23" text-anchor="middle" font-weight="700" fill="white">2</text><text x="131" y="342" font-size="25" fill="#253640">Kuk i koleno savij približno 90°.</text>
<rect x="56" y="379" width="800" height="70" rx="12" fill="#E8F4F0"/><circle cx="91" cy="414" r="23" fill="#356F72"/><text x="91" y="423" font-size="23" text-anchor="middle" font-weight="700" fill="white">3</text><text x="131" y="424" font-size="25" fill="#253640">Pokušaj da podigneš koleno.</text>
<rect x="56" y="461" width="800" height="70" rx="12" fill="#F4F0F9"/><circle cx="91" cy="496" r="23" fill="#356F72"/><text x="91" y="505" font-size="23" text-anchor="middle" font-weight="700" fill="white">4</text><text x="131" y="506" font-size="25" fill="#253640">Ispitivač daje blag otpor nadole.</text>
<rect x="56" y="543" width="800" height="70" rx="12" fill="#E8F4F0"/><circle cx="91" cy="578" r="23" fill="#356F72"/><text x="91" y="587" font-size="23" text-anchor="middle" font-weight="700" fill="white">5</text><text x="131" y="588" font-size="25" fill="#253640">Zabeleži mesto i karakter bola.</text><rect x="875" y="215" width="325" height="200" rx="16" fill="#F3EAF6"/><text x="894" y="249" font-size="23" font-weight="700" fill="#6E4B78">POZITIVAN NALAZ</text><g font-family="DejaVu Sans,Arial,sans-serif"><text x="894" y="289" font-size="20" fill="#394750">Poznat prednji ili</text><text x="894" y="321" font-size="20" fill="#394750">preponski bol tokom</text><text x="894" y="353" font-size="20" fill="#394750">savijanja protiv otpora.</text></g><rect x="875" y="430" width="325" height="195" rx="16" fill="#F7EDEB"/><text x="894" y="466" font-size="21" font-weight="700" fill="#9A5960">NE DOKAZUJE</text><g font-family="DejaVu Sans,Arial,sans-serif"><text x="894" y="510" font-size="20" fill="#394750">Ne dokazuje samostalno</text><text x="894" y="542" font-size="20" fill="#394750">povredu iliopsoasa.</text></g><text x="60" y="677" font-size="21" font-weight="700" fill="#856776">ILUSTRATIVNI SAŽETAK — proveriti potpun postupak i kontraindikacije</text><text x="60" y="708" font-size="19" fill="#667885">Nijedan pojedinačni test ne postavlja dijagnozu. Grafički prikaz je pomoć za učenje.</text></g></svg>